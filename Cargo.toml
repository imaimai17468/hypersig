[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "site"]
# The projects that crates/hypersig_cli/stage.sh and the tests of hypersig_cli
# create under target are packages of their own, as a reader's would be.
exclude = ["target/templates", "target/tmp"]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/imaimai17468/hypersig"
authors = ["Toshiki Imai"]
description = "A web framework written all in Rust: server-owned state, type-checked strings"
keywords = ["hypermedia", "sse", "html", "signals", "axum"]
categories = ["web-programming"]
readme = "README.md"

[workspace.dependencies]
hypersig = { path = "crates/hypersig", version = "=0.9.1" }
hypersig_proc = { path = "crates/hypersig_proc", version = "=0.9.1" }
hypersig_proc_impl = { path = "crates/hypersig_proc_impl", version = "=0.9.1" }
hypersig_i18n = { path = "crates/hypersig_i18n", version = "=0.9.1" }
hypersig_style = { path = "crates/hypersig_style", version = "=0.9.1" }
hypersig_ui = { path = "crates/hypersig_ui", version = "=0.9.1" }

aws-config = "1.13.0"
aws-sdk-dynamodb = "1.134.0"
axum = "0.8.9"
divan = "0.1.21"
futures = "0.3.34"
getrandom = "0.4.3"
insta = "1.49.0"
js-sys = "0.3.106"
multer = "3.1.0"
password-auth = "1.0.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
redis = { version = "1.7.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
# 0.40 links libsqlite3-sys 0.38, and sqlx 0.9's SQLite driver, optional
# and unused here, still takes part in resolving `links = "sqlite3"` and
# accepts only versions below 0.38.
rusqlite = "0.39.0"
sqlx = { version = "0.9.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false }
# 0.15 is out, but tower-sessions-sqlx-store 0.15, tower-sessions-redis-store
# 0.16, and axum-login 0.18 depend on tower-sessions-core 0.14, and a store
# built on it does not implement the `SessionStore` of 0.15's layer.
tower-sessions = { version = "0.14.0", default-features = false }
http-body-util = "0.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
trybuild = "1.0.122"

# Lint set from the Pragmatic Rust Guidelines, M-STATIC-VERIFICATION.
[workspace.lints.rust]
missing_docs = "warn"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
let_underscore_future = "warn"
str_to_string = "warn"
todo = "warn"
unimplemented = "warn"
literal_string_with_formatting_args = "allow"
# Transitive dependencies of axum and tokio pull several versions of the same crate.
multiple_crate_versions = "allow"

# With macOS's default of `unpacked`, every build leaves its object files in
# `target/debug/deps` for the debug info to point at, and nothing removes the
# old ones: a rebuild of `site` adds about 650. `packed` writes one `.dSYM`
# instead, and line tables alone keep that step about as fast as before
# (4.7 s against 4.6 s for `site` after an edit to `html.rs`) while a
# backtrace still names the file and line. A debugger shows no local
# variables.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"
