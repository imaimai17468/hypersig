[package]
name = "site"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The binary has no tests, and `cargo test` would still build and run an
# empty test harness for it.
[[bin]]
name = "site"
path = "src/main.rs"
test = false

[dependencies]
hypersig.workspace = true
hypersig_i18n.workspace = true
hypersig_ui.workspace = true
serde.workspace = true

[dev-dependencies]
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
axum.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true

# The samples of `snippets/database.rs`, `dynamodb.rs`, and `api.rs` are the
# only users of these crates, and cargo-udeps does not see a crate that only
# doctests use.
[package.metadata.cargo-udeps.ignore]
development = ["aws-config", "aws-sdk-dynamodb", "reqwest", "rusqlite"]
