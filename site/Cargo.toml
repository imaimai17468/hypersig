[package]
name = "site"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The binary has no tests, and `cargo test` would still build and run an
# empty test harness for it.
[[bin]]
name = "site"
path = "src/main.rs"
test = false

# The page on testing shows this program with its tests, so `cargo test` runs
# them as it would in the reader's application.
[[example]]
name = "testing"
test = true

[dependencies]
hypersig.workspace = true
hypersig_i18n.workspace = true
hypersig_ui.workspace = true
serde.workspace = true

[dev-dependencies]
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
axum.workspace = true
futures.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tower.workspace = true
tower-sessions = { workspace = true, features = ["axum-core", "memory-store"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

# The samples of `snippets/database.rs`, `dynamodb.rs`, `api.rs`,
# `sessions.rs`, `quality/testing_sessions.rs`, `quality/csp.rs`,
# `logging.rs`, and `static_files.rs` are the only users of these crates, and
# cargo-udeps does not see a crate that only doctests use.
[package.metadata.cargo-udeps.ignore]
development = [
    "aws-config",
    "aws-sdk-dynamodb",
    "getrandom",
    "reqwest",
    "rusqlite",
    "tower-http",
    "tower-sessions",
    "tracing",
    "tracing-subscriber",
]
