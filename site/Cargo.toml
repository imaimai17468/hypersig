[package]
name = "site"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The binary has no tests, and `cargo test` would still build and run an
# empty test harness for it.
[[bin]]
name = "site"
path = "src/main.rs"
test = false

[dependencies]
hypersig.workspace = true
hypersig_i18n.workspace = true
hypersig_ui.workspace = true
serde.workspace = true

[dev-dependencies]
axum.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
