[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures = "0.3"
hypersig = "0.3.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

# Vercel builds each `[[bin]]` under `api/` into a function at its path, and
# `vercel.json` sends every request to `/api/app`, so the two names agree.
[[bin]]
name = "app"
path = "api/app.rs"
