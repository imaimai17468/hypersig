[package]
name = "example-api"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "example-api"

# The binaries have no tests, and `cargo test` would still build and run an
# empty test harness for each.
[[bin]]
name = "example-api"
path = "src/main.rs"
test = false

[[bin]]
name = "notes-backend"
path = "src/bin/notes_backend.rs"
test = false

[dependencies]
axum.workspace = true
hypersig.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true
