[package]
name = "example-auth"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The binary has no tests, and `cargo test` would still build and run an
# empty test harness for it.
[[bin]]
name = "example-auth"
path = "src/main.rs"
test = false

[dependencies]
axum.workspace = true
hypersig.workspace = true
hypersig_ui.workspace = true
password-auth.workspace = true
serde.workspace = true
tokio.workspace = true
tower-sessions = { workspace = true, features = ["axum-core", "memory-store"] }

[lints]
workspace = true
