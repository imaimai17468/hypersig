name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the running deploy rather than
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc -p hypersig -p hypersig_style -p hypersig_proc -p hypersig_ui -p hypersig_i18n --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Fails on a link inside the site, or into the rustdoc output, that
      # reaches no file.
      - run: cargo run -p site -- --out _site --base /hypersig --origin https://imaimai17468.github.io --rustdoc target/doc
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  # Only this job can deploy, so `build`, which runs the site's code, holds
  # no token for Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
