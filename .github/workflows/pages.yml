name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running deploy rather than
# cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p hypersig -p hypersig_style -p hypersig_proc -p hypersig_ui -p hypersig_i18n --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Fails on a link inside the site, or into the rustdoc output, that
      # reaches no file.
      - run: cargo run -p site -- --out _site --base /hypersig --rustdoc target/doc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
