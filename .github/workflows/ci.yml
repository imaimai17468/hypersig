name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p hypersig --no-default-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Renders the documentation site and checks its links into the rustdoc
      # output above, which the Pages workflow publishes on main.
      - run: cargo run -p site -- --out target/site --rustdoc target/doc

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code ../crates/hypersig/assets

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo build --release -p example-counter -p example-todo -p example-todomvc -p example-showcase
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so that a new nightly cannot fail main on its own.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo +nightly-2026-10-14 udeps --workspace --all-targets
      - run: cargo +nightly-2026-10-14 miri test -p hypersig --lib
