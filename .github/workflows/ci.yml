name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which of the jobs below a push or pull request needs. A change
  # that touches only Markdown, the documentation site, the benchmarks, or the
  # pictures in assets/ cannot change what runtime, e2e, or nightly checks,
  # because those jobs read none of these files. The Markdown a crate does
  # read reaches lint and test, which run on every change: the doctests
  # compile the READMEs, and hypersig_cli builds `templates/*/AGENTS.host.md`
  # into the binary the test job builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      site-deps: ${{ steps.filter.outputs.site-deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # A file counts toward a filter only when it matches every pattern
          # of it, so `code` is any file outside the excluded paths.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!site/**'
              - '!bench/**'
              - '!assets/**'
              - '!.claude/**'
            site-deps:
              - 'site/Cargo.toml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # hypersig_desktop links GTK and WebKitGTK, which the runner image
      # lacks, and tao reads the desktop's color scheme over D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The crates a Cloudflare Worker links, built for the target it runs on.
      - run: cargo clippy -p hypersig -p hypersig_i18n -p hypersig_ui --target wasm32-unknown-unknown -- -D warnings
      # Each template is checked in the project `cargo hypersig new` writes
      # from it, with its hypersig pointed at this repository's.
      - name: The Cloudflare template
        run: dir=$(crates/hypersig_cli/stage.sh cloudflare) && cd "$dir" && cargo fmt --check && cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: The server template
        run: dir=$(crates/hypersig_cli/stage.sh server) && cd "$dir" && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: The Vercel template
        run: dir=$(crates/hypersig_cli/stage.sh vercel) && cd "$dir" && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cargo check -p hypersig --no-default-features
      # The `sqlx::query!` macros of examples/postgres build from the query
      # descriptions in examples/postgres/.sqlx. `--check` fails when a query
      # or a migration changed and that directory was not written again.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: sqlx-cli@0.9.0
      - name: examples/postgres/.sqlx matches its queries
        env:
          DATABASE_URL: postgres://postgres:hypersig@127.0.0.1:5432/postgres
        run: |
          docker run -d --rm --name postgres -e POSTGRES_PASSWORD=hypersig -p 127.0.0.1:5432:5432 postgres:18
          until docker exec postgres pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          cargo sqlx migrate run --source examples/postgres/migrations
          cd examples/postgres && cargo sqlx prepare --check
      # With the features docs.rs documents hypersig_desktop with.
      - run: cargo doc --workspace --no-deps --features hypersig_desktop/testing,hypersig_desktop/updater
        env:
          RUSTDOCFLAGS: -D warnings
      # Renders the documentation site and checks its links into the rustdoc
      # output above, which the Pages workflow publishes on main.
      - run: cargo run -p site -- --out target/site --rustdoc target/doc

  # Apart from lint, so the test build and the clippy build run side by side.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: rust-src
          # The tests of hypersig_cli check the Cloudflare projects it writes
          # for the target a worker runs on.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # hypersig_desktop links GTK and WebKitGTK, which the runner image
      # lacks, and tao reads the desktop's color scheme over D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev
      - run: cargo test --workspace

  runtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: The committed bundle matches the source
        run: git diff --exit-code ../crates/hypersig/assets

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The job takes 3 to 5 minutes. Without a limit, a step that hangs runs
    # for GitHub's default of 6 hours and holds back the publish job.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The worker-build cache below holds ~/.cargo/bin/worker-build and
          # the two files where cargo records what it installed.
          cache-bin: false
      # worker-build has no prebuilt binary, so cargo compiles it, which takes
      # about two minutes. The template's wrangler.toml runs the same `cargo
      # install` again, and cargo skips it only when .crates.toml lists the
      # version, so the cache holds that file next to the binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: worker-build-0.8.7-${{ runner.os }}
      - run: cargo install --locked worker-build@0.8.7
      # The Cloudflare template builds in its own target directory under
      # target/templates, which rust-cache drops when it cleans target. This
      # step comes after rust-cache so that its save, which runs in reverse
      # order, happens before that cleaning. ~/.cache/worker-build holds the
      # wasm-bindgen, wasm-opt, and esbuild that worker-build downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target/templates/cloudflare/target
            ~/.cache/worker-build
          key: cloudflare-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/hypersig_cli/templates/cloudflare/**') }}
          restore-keys: cloudflare-${{ runner.os }}-
      # The Vercel template builds in target/templates/vercel/target, which
      # rust-cache drops for the same reason.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/templates/vercel/target
          key: vercel-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/hypersig_cli/templates/vercel/**') }}
          restore-keys: vercel-${{ runner.os }}-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo build --release -p example-counter -p example-todo -p example-todomvc -p example-showcase -p example-style -p example-ui -p example-signup -p example-auth -p example-storefront -p example-prefix -p example-database -p example-postgres -p example-redis -p example-api
      - run: pnpm test
      # The specs of the examples again in WebKit, the engine of Safari and of
      # the desktop window on macOS and Linux, which Playwright downloads.
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test
        env:
          E2E_BROWSER: webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results

  # hypersig_desktop on each system it runs on, and the todo example started
  # in a real web view, which closes once its first page has loaded and
  # prints how long that took.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # xvfb gives the window a display on a runner that has none.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev xvfb xdotool
      - run: cargo clippy -p hypersig_desktop -p example-counter -p example-todo -p example-notes -p example-meter -p example-update --features hypersig_desktop/testing,hypersig_desktop/updater,example-counter/desktop,example-todo/desktop --all-targets -- -D warnings
      - run: cargo test -p hypersig_desktop -p example-notes --features hypersig_desktop/testing,hypersig_desktop/updater
      - run: cargo build --release -p example-todo -p example-notes -p example-meter --features example-todo/desktop,hypersig_desktop/smoke
      # examples/todo/smoke.js adds a todo in the window, waits for it to come
      # back over the page's stream, and does the same from a second window.
      - name: The todo example works in two windows
        shell: bash
        env:
          HYPERSIG_DESKTOP_SMOKE_SCRIPT: examples/todo/smoke.js
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/release/example-todo
          else
            target/release/example-todo
          fi
      # examples/notes/smoke.js edits and saves the file in the window the
      # example opens for it, and waits for the save in the list window.
      - name: The notes example saves a file from a second window
        shell: bash
        env:
          HYPERSIG_DESKTOP_SMOKE_SCRIPT: examples/notes/smoke.js
        run: |
          note="$RUNNER_TEMP/smoke-note.md"
          printf '# Smoke\n' > "$note"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/release/example-notes "$note"
          else
            target/release/example-notes "$note"
          fi
          grep -q 'Saved by the smoke run.' "$note"
      # examples/notes/handoff.js waits in the list window for the file that a
      # second start of notes names, which that start hands to this copy and
      # exits. The second start makes no window, so it needs no display.
      - name: A second start of notes opens its file in the copy running
        shell: bash
        env:
          HYPERSIG_DESKTOP_SMOKE_SCRIPT: examples/notes/handoff.js
        run: |
          printf '# Handoff\n' > "$RUNNER_TEMP/handoff.md"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/release/example-notes &
          else
            target/release/example-notes &
          fi
          first=$!
          sleep 3
          notes="$PWD/target/release/example-notes"
          (cd "$RUNNER_TEMP" && "$notes" handoff.md)
          wait "$first"
      # examples/meter/smoke.js waits for the meter to open the microphone,
      # which the example allows, and checks that the camera is refused.
      # A smoke build gives WebKitGTK and WebView2 fake devices. The macOS
      # runner has no device and would ask the person.
      - name: The meter example is granted the microphone and refused the camera
        if: runner.os != 'macOS'
        shell: bash
        env:
          HYPERSIG_DESKTOP_SMOKE_SCRIPT: examples/meter/smoke.js
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/release/example-meter
          else
            target/release/example-meter
          fi
      # examples/meter/talk.js waits for the page to say "Talking" and then
      # stop, while xdotool presses and releases the push-to-talk key on the
      # X server once a second, so a press before the page's stream opens is
      # followed by another. Xvfb runs no window manager, and the X server
      # delivers a grabbed key whatever has focus.
      - name: The meter example hears its global push-to-talk key
        if: runner.os == 'Linux'
        shell: bash
        env:
          HYPERSIG_DESKTOP_SMOKE_SCRIPT: examples/meter/talk.js
        run: |
          Xvfb :99 &
          export DISPLAY=:99
          sleep 1
          target/release/example-meter &
          app=$!
          while kill -0 "$app" 2>/dev/null; do
            sleep 1
            xdotool keydown ctrl+shift+space
            sleep 0.3
            xdotool keyup ctrl+shift+space
          done
          wait "$app"
      # The packages each system installs from, built from the
      # `[package.metadata.packager]` table of examples/notes/Cargo.toml.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-packager@0.11.8
      - run: cargo packager -p example-notes --release
      # The bundle names the identifier App::new gives, which macOS keys the
      # web view's data by. The packaged binary is built without the smoke
      # feature, as a release is, so it is not started here.
      - name: The notes example's macOS bundle names its identifier
        if: runner.os == 'macOS'
        run: test "$(plutil -extract CFBundleIdentifier raw "target/release/hypersig notes.app/Contents/Info.plist")" = dev.hypersig.example-notes
      # A signed 0.2.0 AppImage of examples/update, served on 127.0.0.1, is
      # installed by a 0.1.0 build over the file `APPIMAGE` names, which
      # stands for the AppImage the person installed; examples/update/smoke.js
      # clicks "Check for updates" and waits for the install. The key is made
      # here and thrown away with the runner.
      - name: The update example installs a newer signed version over itself
        if: runner.os == 'Linux'
        shell: bash
        run: |
          key="$RUNNER_TEMP/update.key"
          cargo packager signer generate --ci --path "$key"
          export HYPERSIG_UPDATE_PUBLIC_KEY="$(cat "$key.pub")"
          export HYPERSIG_UPDATE_ENDPOINT='http://127.0.0.1:8765/{{current_version}}'
          sed -i 's/^version = "0.1.0"$/version = "0.2.0"/' examples/update/Cargo.toml
          CARGO_PACKAGER_SIGN_PRIVATE_KEY="$key" CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD="" \
            cargo packager -p example-update --release --formats appimage
          git checkout examples/update/Cargo.toml Cargo.lock
          served="$RUNNER_TEMP/served"
          mkdir -p "$served"
          cp target/release/*_0.2.0_*.AppImage "$served/app.AppImage"
          signature="$(cat target/release/*_0.2.0_*.AppImage.sig)"
          printf '{"version":"0.2.0","url":"http://127.0.0.1:8765/app.AppImage","signature":"%s","format":"appimage"}' "$signature" > "$served/0.1.0"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$served" &
          cargo build --release -p example-update --features hypersig_desktop/smoke
          cp target/release/example-update "$RUNNER_TEMP/installed.AppImage"
          APPIMAGE="$RUNNER_TEMP/installed.AppImage" HYPERSIG_DESKTOP_SMOKE_SCRIPT=examples/update/smoke.js \
            xvfb-run -a target/release/example-update
          cmp "$RUNNER_TEMP/installed.AppImage" "$served/app.AppImage"
      # The web view offers the microphone only to a bundle that says why it
      # uses it, which examples/meter/Info.plist adds.
      - name: The meter example's macOS bundle says why it uses the microphone
        if: runner.os == 'macOS'
        run: |
          cargo packager -p example-meter --release --formats app
          plutil -extract NSMicrophoneUsageDescription raw "target/release/hypersig meter.app/Contents/Info.plist"


  nightly:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site-deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned so that a new nightly cannot fail main on its own.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-14
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-udeps@0.1.61
      # hypersig_desktop links GTK and WebKitGTK, which the runner image
      # lacks, and tao reads the desktop's color scheme over D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev
      - run: cargo +nightly-2026-10-14 udeps --workspace --all-targets
      - run: cargo +nightly-2026-10-14 miri test -p hypersig --lib
      # tests/public_api.rs reads the rustdoc JSON of each library crate,
      # which only a nightly rustdoc writes.
      - name: Check the public API
        run: |
          for crate in hypersig hypersig_ui hypersig_style hypersig_i18n; do
            cargo +nightly-2026-10-14 rustdoc -p "$crate" --all-features -- -Z unstable-options --output-format json
          done
          cargo +nightly-2026-10-14 test -p hypersig --test public_api -- --ignored

  # Publishes to crates.io every library crate whose workspace version is not
  # there yet, so a push to main that raises the version releases it and any
  # other push publishes nothing.
  publish:
    needs: [changes, lint, test, runtime, e2e, desktop, nightly]
    # A job that `changes` skipped counts as passed, and any other result
    # stops the release.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # The release step below creates a tag and a GitHub Release.
      contents: write
      id-token: write
    # Two pushes close together would otherwise both try the same version.
    concurrency:
      group: publish
      cancel-in-progress: false
    # This job holds the rights to publish and to push, so it runs no
    # third-party action it does not need (`cargo publish` builds in
    # `target/package`, which no cache restores), and the checkout leaves
    # no token in `.git/config` for the build scripts `cargo publish` runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
      - id: pending
        name: List the crates whose version crates.io does not have
        run: |
          args=""
          while read -r name version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'hypersig-ci (https://github.com/imaimai17468/hypersig)' \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) ;;
              404) args="$args -p $name" ;;
              *) echo "crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # `cargo publish` builds each package to verify it, and
      # hypersig_desktop's build links GTK, WebKitGTK, and D-Bus on Linux.
      - if: steps.pending.outputs.args != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev
      # Trusted publishing: crates.io trades the job's OIDC token for a
      # short-lived one, which works only for a crate that already exists and
      # names this repository and ci.yml as its trusted publisher.
      - id: auth
        if: steps.pending.outputs.args != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - if: steps.pending.outputs.args != ''
        run: cargo publish ${{ steps.pending.outputs.args }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Tags the workspace version and makes its GitHub Release, whose notes
      # list the pull requests merged since the previous tag. It runs on every
      # push to main rather than only when the step above published, so a run
      # that failed between the two makes the release on the next push, and a
      # version that already has its release makes no second one.
      - name: Make the release of the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hypersig") | .version')
          if ! gh release view "v$version" > /dev/null 2>&1; then
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
