[package]
name = "bench-datastar"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
datastar = { version = "0.4.1", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1.19", default-features = false }

[workspace]
