[package]
name = "hypersig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# `tests/generate.rs` reads the attribute lists in `data/` to write
# `src/html/attr.rs`, so a build from the package does not need them.
exclude = ["data"]

[features]
default = ["axum"]
axum = ["dep:axum", "dep:futures", "dep:multer", "dep:tokio"]

[dependencies]
# Without axum's default features, so that the `axum` feature builds for
# wasm32-unknown-unknown, where Cloudflare Workers run it.
axum = { version = "0.8.9", optional = true, default-features = false, features = ["matched-path", "query"] }
futures = { workspace = true, optional = true }
# Uploads read their parts with multer directly, because axum's `Field`
# borrows the `Multipart` it came from and so cannot be skipped in a loop that
# returns the next one.
multer = { workspace = true, optional = true }
hypersig_proc.workspace = true
hypersig_style.workspace = true
serde.workspace = true
serde_json.workspace = true

# A stream's keep-alive comments are timed with tokio, which has no timer on
# wasm32-unknown-unknown. `serve` listens with axum's HTTP/1 server and stops
# on the signals tokio watches, neither of which that target has.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.3", optional = true, features = ["macros", "net", "signal", "sync", "time"] }

# `Timestamp::now` reads the clock through JavaScript on wasm32-unknown-unknown,
# where `SystemTime::now` panics.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true

[dev-dependencies]
# The README's quick start, which runs as a doctest, serves with `axum::serve`.
axum.workspace = true
divan.workspace = true
futures.workspace = true
http-body-util.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
