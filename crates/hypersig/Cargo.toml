[package]
name = "hypersig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["axum"]
axum = ["dep:axum", "dep:futures", "dep:multer"]

[dependencies]
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# Uploads read their parts with multer directly, because axum's `Field`
# borrows the `Multipart` it came from and so cannot be skipped in a loop that
# returns the next one.
multer = { workspace = true, optional = true }
hypersig_proc.workspace = true
hypersig_style.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
divan.workspace = true
futures.workspace = true
http-body-util.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
